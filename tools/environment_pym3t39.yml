# few_teeth_tracking トラッカー用の conda 環境（Windows / macOS 共通）。
# pym3t は Python 3.9 用にビルドするので python は 3.9 系に固定する。
#   conda env create -f tools/environment_pym3t39.yml
# tools/setup_pc.ps1（Windows）と tools/setup_mac.sh（Mac）が、環境が無いときに自動でこれを使う。
# チャンネルは conda-forge（Anaconda の defaults は新しい conda で利用規約への同意を求めて止まることがある）。
name: pym3t39
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - numpy==2.0.2
      - opencv-python==4.13.0.92
      - pygrabber==0.2; sys_platform == "win32"
      - comtypes==1.4.16; sys_platform == "win32"
